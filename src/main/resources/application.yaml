spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: roles-permissions
  datasource:
    url: jdbc:mysql://localhost:3306/roles_permissions?createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-in-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_IN_SEC}
    refresh-token-expiration-in-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_IN_SEC}

server:
  port: 8081
  servlet:
    context-path: "/api"
